spring.application.name=portfolio-pro
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfoliopro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}
